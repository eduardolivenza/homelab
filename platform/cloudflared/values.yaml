image:
  repository: cloudflare/cloudflared
  # Pinned on purpose — check https://github.com/cloudflare/cloudflared/releases for the latest.
  tag: "2026.10.5"
  pullPolicy: IfNotPresent
replicas: 2
resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 128Mi
    cpu: 200m

# Tunnel UUID from `cloudflared tunnel create fest-descans`.
tunnelId: "96ed517e-9c76-4e93-8d7d-220cad16eed3"

# Creado por el SealedSecret templates/sealed-credentials.yaml (ver README).
credentialsSecretName: cloudflared-credentials

# Hostname -> Service. cloudflared vive en su propio namespace, así que todos
# los destinos usan el nombre DNS completo del cluster.
ingress:
  - hostname: festdescans.com
    service: http://fest-descans-web.fest-descans.svc.cluster.local:3000
  - hostname: admin.festdescans.com
    service: http://fest-descans-admin.fest-descans.svc.cluster.local:3002
  - hostname: api.festdescans.com
    service: http://fest-descans-api.fest-descans.svc.cluster.local:3001
  - hostname: homeassistant.festdescans.com
    service: http://home-assistant.home-assistant.svc.cluster.local:8123

global:
  imagePullSecrets: []
