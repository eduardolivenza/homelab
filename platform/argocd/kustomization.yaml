# ArgoCD gestionándose a sí mismo. Versión fijada = la que corre hoy en el cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml

# Servidor con poca RAM: quitamos lo que no se usa.
# - Dex: solo para SSO. Con el usuario admin no se usa.
# - Notifications: solo para avisos a Slack/email.
# La app "argocd" tiene prune=false: tras quitarlos hay que borrarlos una vez a mano.
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-notifications-controller-metrics
  # UI accesible solo desde la red de casa: https://192.168.68.53:30443
  # (NodePort; no pasa por el túnel de Cloudflare y Lowi usa CGNAT,
  # así que no es alcanzable desde internet)
  - target:
      kind: Service
      name: argocd-server
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
      - op: add
        path: /spec/ports/1/nodePort
        value: 30443
