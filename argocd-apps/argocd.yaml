apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    homelab/tier: platform
spec:
  project: default
  source:
    repoURL: https://github.com/eduardolivenza/homelab
    targetRevision: HEAD
    path: components/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false     # nunca borrar piezas de ArgoCD automáticamente
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
