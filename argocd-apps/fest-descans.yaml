# Parent app for the fest-descans website: deploys the ApplicationSet in
# components/fest-descans/, which generates fest-descans-web, -admin and -api.
# In the ArgoCD UI the three apps appear grouped under this one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fest-descans
  namespace: argocd
  labels:
    homelab/tier: app
spec:
  project: default
  source:
    repoURL: https://github.com/eduardolivenza/homelab
    targetRevision: HEAD
    path: components/fest-descans
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false     # never delete the ApplicationSet automatically
      selfHeal: true
