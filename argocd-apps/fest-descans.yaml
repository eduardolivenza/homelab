# fest-descans website. Code, charts, values and its SealedSecrets live in the
# fest-page repo (helm/<app>); this repo only declares WHAT is deployed.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fest-descans
  namespace: argocd
  labels:
    homelab/tier: app
spec:
  generators:
    - list:
        elements:
          - app: web
          - app: admin
          - app: api
  template:
    metadata:
      name: "fest-descans-{{app}}"
      labels:
        homelab/tier: app
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/eduardolivenza/fest-page
        targetRevision: HEAD
        path: "helm/{{app}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: fest-descans
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
