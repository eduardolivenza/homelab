# Copiado tal cual de la Application que hoy corre en el cluster.
replicaCount: 1
image:
  repository: ghcr.io/home-assistant/home-assistant
  # TODO: fijar la versión que corre hoy (Ajustes > Acerca de en HA) en vez de "stable",
  # para que un reinicio no te actualice HA sin avisar. No bajar de versión.
  tag: 2026.8.3
env:
  - name: TZ
    value: "Europe/Madrid"
persistence:
  enabled: true
  size: 5Gi
  storageClass: local-path
service:
  type: ClusterIP
  port: 8123
ingress:
  enabled: false
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet
securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - NET_RAW
additionalVolumes:
  - name: recordings
    hostPath:
      path: /home/edu/ha-recordings
      type: Directory
additionalMounts:
  - name: recordings
    mountPath: /config/recordings
configuration:
  enabled: true
  forceInit: true
startupProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
livenessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  periodSeconds: 30
  timeoutSeconds: 15
  failureThreshold: 10
readinessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
