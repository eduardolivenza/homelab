apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ha-voice-tts-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-voice-tts
  labels: { app: ha-voice-tts }
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO volume
  selector:
    matchLabels: { app: ha-voice-tts }
  template:
    metadata:
      labels: { app: ha-voice-tts }
    spec:
      containers:
        - name: piper
          # Pinned (Renovate proposes upgrades). Entrypoint already passes --uri tcp://0.0.0.0:10200 --data-dir /data.
          image: docker.io/rhasspy/wyoming-piper:2.5.3
          args:
            # Default voice. HA can pick other voices per pipeline (e.g. ca_ES-upc_ona-medium,
            # en_US-lessac-medium); they are downloaded into /data on first use.
            - --voice
            - es_ES-davefx-medium
          ports:
            - { name: wyoming, containerPort: 10200 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: "2", memory: 512Mi }
          # Wyoming is raw TCP, not HTTP. The first start downloads the voice: generous probes (slow HDD).
          startupProbe:
            tcpSocket: { port: wyoming }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: wyoming }
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ha-voice-tts-data
---
apiVersion: v1
kind: Service
metadata:
  name: ha-voice-tts
spec:
  selector: { app: ha-voice-tts }
  ports:
    - { name: wyoming, port: 10200, targetPort: wyoming }
