# Values of the Home Assistant chart (pajikos). Originally copied 1:1 from the hand-made
# Application; see .claude/skills/homelab-context/references/decisions.md (D8).
replicaCount: 1
image:
  repository: ghcr.io/home-assistant/home-assistant
  # Pinned on purpose (never "stable"). Renovate opens one PR per monthly release.
  # HA cannot be downgraded: back up before each upgrade (homelab-upgrades skill).
  tag: 2026.10.4
env:
  - name: TZ
    value: "Europe/Madrid"
persistence:
  enabled: true
  size: 5Gi
  storageClass: local-path
service:
  type: ClusterIP
  port: 8123
ingress:
  enabled: false
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet
securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - NET_RAW
additionalVolumes:
  - name: recordings
    hostPath:
      path: /home/edu/ha-recordings
      type: Directory
additionalMounts:
  - name: recordings
    mountPath: /config/recordings
configuration:
  enabled: true
  forceInit: true
startupProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
livenessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  periodSeconds: 30
  timeoutSeconds: 15
  failureThreshold: 10
readinessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
