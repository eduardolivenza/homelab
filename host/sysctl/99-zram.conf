# /etc/sysctl.d/99-zram.conf — applied by hand (2026-11-13): sudo sysctl -p /etc/sysctl.d/99-zram.conf
# zram (1.6 GB, prio 5) is preferred over /swap.img. A high swappiness makes the kernel compress idle
# anonymous memory into zram instead of evicting program code that must then be re-read from the HDD.
# Result: I/O wait went from 60-95 % to 1-4 %.
vm.swappiness=150
# No swap readahead: only useful for disk swap, not zram.
vm.page-cluster=0
