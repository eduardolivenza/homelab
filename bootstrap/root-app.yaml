# Root "app of apps". Lo único que se aplica a mano (ver README).
# Gestiona todo lo que hay en argocd-apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eduardolivenza/homelab
    targetRevision: HEAD
    path: argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false     # no borrar Applications por accidente
      selfHeal: true
